schemaVersion: 2.3.0
metadata:
  name: simple-chatbot
  version: 1.0.0
  description: Simple chatbot.
  projectType: Python
  language: Python
  tags: [ 'python', 'chatbot', 'llm', 'ai' ]
  architecture: [ 'amd64' ]
  displayName: Simple Chatbot
components:
  - name: python
    container:
      endpoints:
        - name: http
          targetPort: 8080
      image: registry.redhat.io/devspaces/udi-rhel9:3.21
      volumeMounts:
        - name: venv
          path: /home/user/.venv
      memoryLimit: '2Gi'
      memoryRequest: '1Gi'
      cpuLimit: '2'
      cpuRequest: '1'
      mountSources: true
  - name: venv
    volume:
      size: 1G
commands:
  - id: install
    exec:
      label: "Install dependencies"
      component: web
      workingDir: ${PROJECT_SOURCE}
      commandLine: python -m venv .venv && . .venv/bin/activate && pip install -r ./requirements.txt
      group:
        kind: build
        isDefault: true
  - id: run
    exec:
      label: "Run the application"
      component: web
      workingDir: ${PROJECT_SOURCE}
      commandLine: ./run-local.sh
      group:
        kind: run
        isDefault: true
